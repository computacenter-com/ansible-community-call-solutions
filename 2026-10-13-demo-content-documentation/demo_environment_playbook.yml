---
- name: Create demo environment
  hosts: localhost
  gather_facts: false
  vars:
    managed_nodes_state: started
    managed_nodes_stop_signal: 9
    managed_nodes_list:
      - name: node1
        hostname: node1.example.com
        image: ghcr.io/timgrt/ansible-test-image-rhel9:main
      - name: node2
        hostname: node2.example.com
        image: ghcr.io/timgrt/ansible-test-image-rhel8:python3.12
    container_labels_dict:
      role: demo
      owner: Ansible Community
  roles:
    - demo_environment
